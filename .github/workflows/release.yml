name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm deps
        run: npm ci

      - name: Build Tauri installer (no models bundled)
        run: npm run tauri:build

      - name: Collect installer artefacts
        id: artefacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artefacts | Out-Null
          $bundle = "src-tauri/target/release/bundle"
          Get-ChildItem -Path $bundle -Recurse -Include *.exe,*.msi |
            Where-Object { $_.FullName -notmatch '\\target\\release\\bundle\\.*\\deps\\' } |
            ForEach-Object {
              Copy-Item $_.FullName -Destination "artefacts/" -Force
              Write-Host "Collected: $($_.Name)"
            }
          Get-ChildItem artefacts

      - name: Upload artefacts (workflow run)
        uses: actions/upload-artifact@v4
        with:
          name: voice-keyboard-installers
          path: artefacts/*

      - name: Create / update GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artefacts/*
